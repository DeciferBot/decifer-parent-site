<svg viewBox="0 0 1180 2504" width="100%" xmlns="http://www.w3.org/2000/svg" role="img"
 aria-label="Where AI fits in a business technology stack. Applications, business systems and foundations already exist and are shown in grey. AI is one new layer, shown in orange, between the applications and the business systems. Inside that layer the model is one part in seven.">
<rect width="1180" height="2504" fill="#f1f2f4"/>
<text x="70" y="76" font-family="IBM Plex Mono,monospace" font-size="13.5" letter-spacing="2.6" fill="#f05a28">DECIFER</text>
<text x="70" y="128" font-family="Source Serif 4,Georgia,serif" font-size="50" font-weight="600" fill="#252a31">Where AI actually sits</text>
<text x="70" y="190" font-family="IBM Plex Mono,monospace" font-size="13.5" letter-spacing="2.2" fill="#a3a9b1">01</text><text x="70" y="230" font-family="Source Serif 4,Georgia,serif" font-size="36" font-weight="600" fill="#252a31">What you already run</text><line x1="70" y1="250" x2="1110" y2="250" stroke="#252a31" stroke-width="1.8"/><polygon points="290,558 520,673 520,703 290,588" fill="#c9ced5" stroke="#b6bcc4" stroke-width="1.5" stroke-linejoin="round"/><polygon points="750,558 520,673 520,703 750,588" fill="#dcdfe4" stroke="#b6bcc4" stroke-width="1.5" stroke-linejoin="round"/><polygon points="520,443 750,558 520,673 290,558" fill="#e9ebee" stroke="#b6bcc4" stroke-width="1.5" stroke-linejoin="round"/><polygon points="290,484 520,599 520,629 290,514" fill="#c9ced5" stroke="#b6bcc4" stroke-width="1.5" stroke-linejoin="round"/><polygon points="750,484 520,599 520,629 750,514" fill="#dcdfe4" stroke="#b6bcc4" stroke-width="1.5" stroke-linejoin="round"/><polygon points="520,369 750,484 520,599 290,484" fill="#e9ebee" stroke="#b6bcc4" stroke-width="1.5" stroke-linejoin="round"/><polygon points="290,410 520,525 520,555 290,440" fill="#c9ced5" stroke="#b6bcc4" stroke-width="1.5" stroke-linejoin="round"/><polygon points="750,410 520,525 520,555 750,440" fill="#dcdfe4" stroke="#b6bcc4" stroke-width="1.5" stroke-linejoin="round"/><polygon points="520,295 750,410 520,525 290,410" fill="#e9ebee" stroke="#b6bcc4" stroke-width="1.5" stroke-linejoin="round"/><line x1="750" y1="410" x2="806" y2="410" stroke="#d7dade" stroke-width="1.3" stroke-linecap="round"/><circle cx="750" cy="410" r="3.2" fill="#d7dade"/><text x="820" y="406" font-family="Figtree,sans-serif" font-size="22" font-weight="600" fill="#252a31">Applications</text><text x="820" y="429" font-family="Figtree,sans-serif" font-size="15" fill="#727984">where people meet your business</text><line x1="750" y1="484" x2="806" y2="484" stroke="#d7dade" stroke-width="1.3" stroke-linecap="round"/><circle cx="750" cy="484" r="3.2" fill="#d7dade"/><text x="820" y="480" font-family="Figtree,sans-serif" font-size="22" font-weight="600" fill="#252a31">Business systems</text><text x="820" y="503" font-family="Figtree,sans-serif" font-size="15" fill="#727984">where the work is recorded</text><line x1="750" y1="558" x2="806" y2="558" stroke="#d7dade" stroke-width="1.3" stroke-linecap="round"/><circle cx="750" cy="558" r="3.2" fill="#d7dade"/><text x="820" y="554" font-family="Figtree,sans-serif" font-size="22" font-weight="600" fill="#252a31">Foundations</text><text x="820" y="577" font-family="Figtree,sans-serif" font-size="15" fill="#727984">data, infrastructure and security</text><text x="70" y="759" font-family="Figtree,sans-serif" font-size="19" fill="#4a5058">Three layers, already in place, in every business that runs on computers.</text><text x="70" y="833" font-family="IBM Plex Mono,monospace" font-size="13.5" letter-spacing="2.2" fill="#a3a9b1">02</text><text x="70" y="873" font-family="Source Serif 4,Georgia,serif" font-size="36" font-weight="600" fill="#252a31">Where AI fits</text><line x1="70" y1="893" x2="1110" y2="893" stroke="#252a31" stroke-width="1.8"/><polygon points="290,1337 520,1452 520,1482 290,1367" fill="#c9ced5" stroke="#b6bcc4" stroke-width="1.5" stroke-linejoin="round"/><polygon points="750,1337 520,1452 520,1482 750,1367" fill="#dcdfe4" stroke="#b6bcc4" stroke-width="1.5" stroke-linejoin="round"/><polygon points="520,1222 750,1337 520,1452 290,1337" fill="#e9ebee" stroke="#b6bcc4" stroke-width="1.5" stroke-linejoin="round"/><polygon points="290,1263 520,1378 520,1408 290,1293" fill="#c9ced5" stroke="#b6bcc4" stroke-width="1.5" stroke-linejoin="round"/><polygon points="750,1263 520,1378 520,1408 750,1293" fill="#dcdfe4" stroke="#b6bcc4" stroke-width="1.5" stroke-linejoin="round"/><polygon points="520,1148 750,1263 520,1378 290,1263" fill="#e9ebee" stroke="#b6bcc4" stroke-width="1.5" stroke-linejoin="round"/><polygon points="290,1153 520,1268 520,1308 290,1193" fill="#c2431b" stroke="#c2431b" stroke-width="2" stroke-linejoin="round"/><polygon points="750,1153 520,1268 520,1308 750,1193" fill="#f05a28" stroke="#c2431b" stroke-width="2" stroke-linejoin="round"/><polygon points="520,1038 750,1153 520,1268 290,1153" fill="#fdeee8" stroke="#c2431b" stroke-width="2" stroke-linejoin="round"/><polygon points="290,1053 520,1168 520,1198 290,1083" fill="#c9ced5" stroke="#b6bcc4" stroke-width="1.5" stroke-linejoin="round"/><polygon points="750,1053 520,1168 520,1198 750,1083" fill="#dcdfe4" stroke="#b6bcc4" stroke-width="1.5" stroke-linejoin="round"/><polygon points="520,938 750,1053 520,1168 290,1053" fill="#e9ebee" stroke="#b6bcc4" stroke-width="1.5" stroke-linejoin="round"/><line x1="262" y1="1184" x2="262" y2="1132" stroke="#727984" stroke-width="1.8" stroke-linecap="round"/><polygon points="262,1143 256,1131 268,1131" fill="#727984"/><text x="70" y="1159.5" font-family="IBM Plex Mono,monospace" font-size="13.5" fill="#727984">work that needs</text><text x="70" y="1179.5" font-family="IBM Plex Mono,monospace" font-size="13.5" fill="#727984">judgement</text><line x1="262" y1="1300" x2="262" y2="1242" stroke="#727984" stroke-width="1.8" stroke-linecap="round"/><polygon points="262,1253 256,1241 268,1241" fill="#727984"/><text x="70" y="1272.5" font-family="IBM Plex Mono,monospace" font-size="13.5" fill="#727984">reads the record,</text><text x="70" y="1292.5" font-family="IBM Plex Mono,monospace" font-size="13.5" fill="#727984">writes the outcome</text><line x1="750" y1="1053" x2="806" y2="1053" stroke="#d7dade" stroke-width="1.3" stroke-linecap="round"/><circle cx="750" cy="1053" r="3.2" fill="#d7dade"/><text x="820" y="1049" font-family="Figtree,sans-serif" font-size="22" font-weight="500" fill="#727984">Applications</text><text x="820" y="1072" font-family="Figtree,sans-serif" font-size="15" fill="#a3a9b1">unchanged</text><line x1="750" y1="1153" x2="806" y2="1153" stroke="#f05a28" stroke-width="1.3" stroke-linecap="round"/><circle cx="750" cy="1153" r="3.2" fill="#f05a28"/><text x="820" y="1149" font-family="Figtree,sans-serif" font-size="22" font-weight="700" fill="#c2431b">The AI layer</text><text x="820" y="1172" font-family="Figtree,sans-serif" font-size="15" fill="#c2431b">the only new layer</text><line x1="750" y1="1263" x2="806" y2="1263" stroke="#d7dade" stroke-width="1.3" stroke-linecap="round"/><circle cx="750" cy="1263" r="3.2" fill="#d7dade"/><text x="820" y="1259" font-family="Figtree,sans-serif" font-size="22" font-weight="500" fill="#727984">Business systems</text><text x="820" y="1282" font-family="Figtree,sans-serif" font-size="15" fill="#a3a9b1">unchanged</text><line x1="750" y1="1337" x2="806" y2="1337" stroke="#d7dade" stroke-width="1.3" stroke-linecap="round"/><circle cx="750" cy="1337" r="3.2" fill="#d7dade"/><text x="820" y="1333" font-family="Figtree,sans-serif" font-size="22" font-weight="500" fill="#727984">Foundations</text><text x="820" y="1356" font-family="Figtree,sans-serif" font-size="15" fill="#a3a9b1">unchanged, now decisive</text><text x="70" y="1538" font-family="Figtree,sans-serif" font-size="19" fill="#4a5058">One new layer, between the screens and the systems of record.</text><text x="70" y="1568" font-family="Figtree,sans-serif" font-size="19" fill="#727984">Until now that work was done by people, or by rules that broke on anything unusual.</text><text x="70" y="1642" font-family="IBM Plex Mono,monospace" font-size="13.5" letter-spacing="2.2" fill="#a3a9b1">03</text><text x="70" y="1682" font-family="Source Serif 4,Georgia,serif" font-size="36" font-weight="600" fill="#252a31">Inside the new layer</text><line x1="70" y1="1702" x2="1110" y2="1702" stroke="#252a31" stroke-width="1.8"/><polygon points="392,1806 520,1870 520,1894 392,1830" fill="#c2431b" stroke="#c2431b" stroke-width="2" stroke-linejoin="round"/><polygon points="648,1806 520,1870 520,1894 648,1830" fill="#f05a28" stroke="#c2431b" stroke-width="2" stroke-linejoin="round"/><polygon points="520,1742 648,1806 520,1870 392,1806" fill="#fdeee8" stroke="#c2431b" stroke-width="2" stroke-linejoin="round"/><text x="520" y="1813" text-anchor="middle" font-family="Figtree,sans-serif" font-size="17" font-weight="700" fill="#c2431b">The AI layer</text><line x1="520" y1="1894" x2="195.0" y2="1965" stroke="#d7dade" stroke-width="1.1"/><line x1="520" y1="1894" x2="465.0" y2="1965" stroke="#d7dade" stroke-width="1.1"/><line x1="520" y1="1894" x2="735.0" y2="1965" stroke="#d7dade" stroke-width="1.1"/><line x1="520" y1="1894" x2="1005.0" y2="1965" stroke="#d7dade" stroke-width="1.1"/><line x1="520" y1="1894" x2="330.0" y2="2081" stroke="#d7dade" stroke-width="1.1"/><line x1="520" y1="1894" x2="600.0" y2="2081" stroke="#d7dade" stroke-width="1.1"/><line x1="520" y1="1894" x2="870.0" y2="2081" stroke="#d7dade" stroke-width="1.1"/><rect x="70" y="1972" width="250" height="96" rx="5" fill="#f05a28"/><text x="90" y="2012" font-family="Figtree,sans-serif" font-size="21" font-weight="700" fill="#2b1409">The model</text><text x="90" y="2036" font-family="Figtree,sans-serif" font-size="14.5" fill="#612c13">rented, by the unit</text><rect x="340" y="1972" width="250" height="96" rx="5" fill="#ffffff" stroke="#d7dade" stroke-width="1.3"/><text x="360" y="2012" font-family="Figtree,sans-serif" font-size="19" font-weight="600" fill="#252a31">What it can read</text><text x="360" y="2036" font-family="Figtree,sans-serif" font-size="14.5" fill="#727984">the records placed in front of it</text><rect x="610" y="1972" width="250" height="96" rx="5" fill="#ffffff" stroke="#d7dade" stroke-width="1.3"/><text x="630" y="2012" font-family="Figtree,sans-serif" font-size="19" font-weight="600" fill="#252a31">What it retains</text><text x="630" y="2036" font-family="Figtree,sans-serif" font-size="14.5" fill="#727984">and what it must forget</text><rect x="880" y="1972" width="250" height="96" rx="5" fill="#ffffff" stroke="#d7dade" stroke-width="1.3"/><text x="900" y="2012" font-family="Figtree,sans-serif" font-size="19" font-weight="600" fill="#252a31">What it can act on</text><text x="900" y="2036" font-family="Figtree,sans-serif" font-size="14.5" fill="#727984">send, book, refund</text><rect x="205" y="2088" width="250" height="96" rx="5" fill="#ffffff" stroke="#d7dade" stroke-width="1.3"/><text x="225" y="2128" font-family="Figtree,sans-serif" font-size="19" font-weight="600" fill="#252a31">Where a person approves</text><text x="225" y="2152" font-family="Figtree,sans-serif" font-size="14.5" fill="#727984">the sign-off point</text><rect x="475" y="2088" width="250" height="96" rx="5" fill="#ffffff" stroke="#d7dade" stroke-width="1.3"/><text x="495" y="2128" font-family="Figtree,sans-serif" font-size="19" font-weight="600" fill="#252a31">Continuous assurance</text><text x="495" y="2152" font-family="Figtree,sans-serif" font-size="14.5" fill="#727984">providers change it silently</text><rect x="745" y="2088" width="250" height="96" rx="5" fill="#ffffff" stroke="#d7dade" stroke-width="1.3"/><text x="765" y="2128" font-family="Figtree,sans-serif" font-size="19" font-weight="600" fill="#252a31">Audit trail</text><text x="765" y="2152" font-family="Figtree,sans-serif" font-size="14.5" fill="#727984">what you show a regulator</text><rect x="70" y="2260" width="1040" height="168" rx="6" fill="#252a31"/><text x="106" y="2304" font-family="Figtree,sans-serif" font-size="15" letter-spacing="1.8" fill="#a3a9b1">WHAT MOST BUDGETS COVER</text><rect x="106" y="2326" width="129" height="42" rx="3" fill="#f05a28" stroke="#f05a28" stroke-width="1.5"/><rect x="246" y="2326" width="129" height="42" rx="3" fill="none" stroke="#4e555e" stroke-width="1.5"/><rect x="386" y="2326" width="129" height="42" rx="3" fill="none" stroke="#4e555e" stroke-width="1.5"/><rect x="526" y="2326" width="129" height="42" rx="3" fill="none" stroke="#4e555e" stroke-width="1.5"/><rect x="666" y="2326" width="129" height="42" rx="3" fill="none" stroke="#4e555e" stroke-width="1.5"/><rect x="806" y="2326" width="129" height="42" rx="3" fill="none" stroke="#4e555e" stroke-width="1.5"/><rect x="946" y="2326" width="129" height="42" rx="3" fill="none" stroke="#4e555e" stroke-width="1.5"/><text x="106" y="2402" font-family="Figtree,sans-serif" font-size="18" fill="#c9ced4">The model is one part in seven. The other six decide whether it can be trusted in production.</text>
</svg>